name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    # core 依赖 DPAPI / winreg，必须在 Windows 上跑
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest test_fetch_models_isolation -v

      - name: Run backend verification (isolated DB)
        run: python verify_backend.py
